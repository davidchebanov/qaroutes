<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:var(--tg-theme-bg-color,#FFFFFF);
  --surface:var(--tg-theme-secondary-bg-color,#FFFFFF);
  --ink:var(--tg-theme-text-color,#141412);
  --muted:var(--tg-theme-hint-color,#8A8880);
  --line:rgba(128,128,128,.26);
  --line-soft:rgba(128,128,128,.15);
  --accent:#C4361B;
  --sans:'Onest',-apple-system,sans-serif;
  --display:'Unbounded',var(--sans);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:var(--tg-theme-bg-color,#17171A);
    --surface:var(--tg-theme-secondary-bg-color,#222226);
    --ink:var(--tg-theme-text-color,#F0EFEC);
    --muted:var(--tg-theme-hint-color,#95948E);
    --line:rgba(255,255,255,.17);
    --line-soft:rgba(255,255,255,.09);
    --accent:#E85C3F;
  }
}

body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  min-height:100vh;padding-bottom:48px;
  -webkit-font-smoothing:antialiased;
}

/* ── header ── */
.hdr{padding:26px 20px 18px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.logo-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}
.logo-t{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.04em;line-height:1}
.sub{font-size:11px;color:var(--muted);letter-spacing:.02em;font-weight:400}

main{padding:0 20px}

/* ── label ── */
.lbl{
  font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:26px 0 11px;display:flex;align-items:center;gap:9px;
}
.lbl::after{content:'';flex:1;height:1px;background:var(--line-soft)}

/* ── categories ── */
.cats{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.cat{
  background:var(--bg);padding:12px 13px;cursor:pointer;position:relative;
  transition:background .12s,color .12s;-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;justify-content:center;min-height:58px;
}
.cat.on{background:var(--ink)}
.cat.on .cat-n{color:var(--bg)}
.cat.on .cat-d{color:var(--bg);opacity:.6}
.cat-row{display:flex;align-items:center;gap:7px}
.cat-ico{font-size:15px;line-height:1;flex-shrink:0}
.cat-n{font-size:13px;font-weight:500;letter-spacing:-.015em;line-height:1.2;color:var(--ink)}
.cat-d{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-cnt{display:none}

/* ── metro ── */
.mwrap{position:relative}
.inp{
  width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
  border-radius:0;padding:11px 2px;font-family:var(--sans);font-size:15px;
  color:var(--ink);outline:none;transition:border-color .15s;letter-spacing:-.01em;
}
.inp::placeholder{color:var(--muted);letter-spacing:-.01em}
.inp:focus{border-bottom-color:var(--ink)}
.mdd{
  position:absolute;top:calc(100% + 1px);left:0;right:0;background:var(--surface);
  border:1px solid var(--ink);max-height:210px;overflow-y:auto;z-index:200;display:none;
}
.mdd.show{display:block}
.mopt{padding:11px 13px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line-soft);letter-spacing:-.01em;color:var(--ink)}
.mopt:last-child{border-bottom:none}
.mopt:active{background:var(--bg)}
.mopt b{font-weight:600;color:var(--accent)}
.mtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.mtag{
  border:1px solid var(--line);padding:5px 7px 5px 10px;
  font-size:12px;font-weight:400;display:flex;align-items:center;gap:7px;letter-spacing:-.01em;color:var(--ink);
}
.mtag-x{cursor:pointer;font-size:14px;line-height:1;border:none;background:none;color:var(--muted);padding:0 2px;font-family:var(--sans)}
.mtag-x:hover{color:var(--accent)}

/* ── duration ── */
.dur-wrap{border:1px solid var(--line);padding:15px 14px 13px}
.dur-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;gap:10px}
.dur-label{font-size:15px;font-weight:500;letter-spacing:-.02em}
.dur-hint{font-size:11px;color:var(--muted);letter-spacing:-.01em;text-align:right}
.dur-track{position:relative;height:1px;background:var(--line);margin:0 6px}
.dur-fill{position:absolute;left:0;top:0;height:1px;background:var(--ink);transition:width .22s cubic-bezier(.4,0,.2,1)}
.dur-steps{display:flex;margin-top:9px}
.dur-step{flex:1;text-align:center;cursor:pointer;padding:2px;-webkit-tap-highlight-color:transparent}
.dur-step-dot{width:7px;height:7px;border-radius:50%;background:var(--bg);border:1px solid var(--line);margin:0 auto 8px;transition:.18s;position:relative;top:-4px}
.dur-step.on .dur-step-dot{background:var(--ink);border-color:var(--ink);transform:scale(1.25)}
.dur-step-txt{font-size:10.5px;font-weight:400;color:var(--muted);letter-spacing:-.01em;line-height:1.35;transition:.18s}
.dur-step.on .dur-step-txt{color:var(--ink);font-weight:500}

/* ── slider ── */
.ctrl{border:1px solid var(--line);padding:15px 14px 17px}
.ctrl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:15px}
.ctrl-nm{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ctrl-v{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.03em}
input[type=range]{width:100%;-webkit-appearance:none;height:1px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--ink);cursor:pointer}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:var(--ink);cursor:pointer}

/* ── generate ── */
.gbtn{
  width:100%;margin-top:26px;background:var(--ink);color:var(--bg);border:none;
  padding:17px;font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:-.03em;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:opacity .15s;-webkit-tap-highlight-color:transparent;
}
.gbtn:active{opacity:.75}
.gbtn:disabled{opacity:.4;cursor:default}
.spin{width:13px;height:13px;border:1.5px solid rgba(128,128,128,.4);border-top-color:currentColor;border-radius:50%;animation:spin .65s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── disclaimer ── */
.disclaimer{border-left:2px solid var(--accent);padding:11px 0 11px 13px;margin-top:22px;display:none;animation:fade .3s ease}
.disclaimer-ico{display:none}
.disclaimer-txt{font-size:13px;color:var(--ink);line-height:1.45;letter-spacing:-.01em}
.disclaimer-sub{font-size:11.5px;color:var(--muted);margin-top:5px;letter-spacing:-.01em}

/* ── result ── */
.rcard{border-top:1px solid var(--ink);padding-top:20px;margin-top:28px;display:none;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.rbs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.rb{font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0}
.rb+.rb::before{content:'/';margin-right:7px;opacity:.45}
.rb-cat{color:var(--ink)}
.rtitle{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.045em;line-height:1.2;margin-bottom:20px}

/* ── stops ── */
.stop-wrap{position:relative;border-top:1px solid var(--line-soft)}
.stop-wrap:first-child{border-top:none}
.stop{display:flex;gap:13px;padding:15px 0}
.stop-wrap .stop{padding-right:44px}
.snum{font-family:var(--display);font-size:11px;font-weight:600;color:var(--muted);flex-shrink:0;width:18px;padding-top:3px;letter-spacing:-.02em}
.sinfo{flex:1;min-width:0}
.sname{font-size:16px;font-weight:500;letter-spacing:-.025em;line-height:1.25}
.sdet{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5;letter-spacing:-.005em}
.smeta{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;align-items:center}
.sm-m,.sm-w{font-size:11px;font-weight:400;letter-spacing:-.01em;color:var(--muted);background:none;padding:0}
.sm-m{color:var(--ink);font-weight:500}
.swap-btn{
  position:absolute;top:15px;right:0;background:none;border:none;padding:2px 0;
  font-size:11px;font-weight:400;letter-spacing:-.01em;color:var(--muted);
  cursor:pointer;transition:color .15s;border-bottom:1px solid transparent;font-family:var(--sans);
}
.swap-btn:hover,.swap-btn:active{color:var(--accent);border-bottom-color:var(--accent)}
.swap-btn.spinning{opacity:.4;pointer-events:none}

/* ── story ── */
.story{border-top:1px solid var(--line-soft);padding-top:16px;margin-top:6px;font-size:14px;color:var(--muted);line-height:1.55;letter-spacing:-.01em}

/* ── actions ── */
.rrow{display:flex;gap:1px;margin-top:24px;background:var(--line);border:1px solid var(--line)}
.rbtn,.ybtn{
  flex:1;background:var(--bg);border:none;padding:14px 8px;
  font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:-.01em;
  color:var(--ink);cursor:pointer;text-align:center;text-decoration:none;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:background .12s,color .12s;-webkit-tap-highlight-color:transparent;min-width:0;
}
.rbtn:hover,.rbtn:active,.ybtn:hover,.ybtn:active{background:var(--ink);color:var(--bg)}
</style>

<body>

<div class="hdr">
  <div class="logo"><div class="logo-dot"></div><div class="logo-t">мои маршруты</div></div>

</div>
<main>

  <div class="lbl">станция метро</div>
  <div class="mwrap">

<button class="gbtn" id="genBtn">

      <button class="rbtn" id="regenBtn">&#8634; другой</button>
      <a class="ybtn" id="yMapBtn" href="#" target="_blank" style="display:none">&#128205; на карте</a>
      <button class="rbtn" id="shareBtn">&#8593; поделиться</button>
    </div>

</main>
<script>
try{var tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();}}catch(e){var tg=null;}

var DB = JSON.parse(document.getElementById('j-db').textContent);
var MA = JSON.parse(document.getElementById('j-metro').textContent);
window._MC = JSON.parse(document.getElementById('j-mc').textContent);

var CATS = [
  {id:'еда', ico:'&#127836;', n:'еда', d:'рестораны, бистро'},
  {id:'кофе', ico:'&#9749;', n:'кофе', d:'кофейни, specialty'},
  {id:'бар', ico:'&#127864;', n:'бары', d:'вино, коктейли'},
  {id:'музыка', ico:'&#127911;', n:'музыка', d:'джаз, винил, концерты'},
  {id:'шопинг', ico:'&#128717;', n:'шопинг', d:'бутики, секонд'},
  {id:'театр', ico:'&#127917;', n:'театры', d:'спектакли'},
  {id:'кино', ico:'&#127902;', n:'кино', d:'кинотеатры'},
  {id:'галереи', ico:'&#127912;', n:'галереи', d:'музеи, выставки'},
  {id:'книги', ico:'&#128218;', n:'книжные', d:'магазины, библиотеки'},
  {id:'природа', ico:'&#127807;', n:'прогулка', d:'парки, скверы'},
  {id:'бильярд', ico:'&#127921;', n:'бильярд', d:'клубы, снукер'},
  {id:'отдых', ico:'&#127774;', n:'отдых', d:'спа, бани, отели'},
  {id:'спорт', ico:'&#127939;', n:'спорт', d:'йога, бег, студии'},
  {id:'особое', ico:'&#10024;', n:'особое', d:'антикафе, фото'},
];

var DUR = [
  {label:'на час',             hint:'пешком, один район',   maxD:1100,  target:700,  fill:16},
  {label:'на несколько часов', hint:'пешком между точками', maxD:2600,  target:2200, fill:50},
  {label:'на весь день',       hint:'по городу',            maxD:13000, target:7000, fill:100},
];

var sc = {}, metro = [], dur = 0, pts = 3, last = null;

function hav(la1,lo1,la2,lo2){
  var R=6371000,dlat=(la2-la1)*Math.PI/180,dlon=(lo2-lo1)*Math.PI/180;
  var a=Math.sin(dlat/2)*Math.sin(dlat/2)+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dlon/2)*Math.sin(dlon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function maxSpread(pts){
  var max=0;
  for(var i=0;i<pts.length;i++)for(var j=i+1;j<pts.length;j++){var d=hav(pts[i].la,pts[i].lo,pts[j].la,pts[j].lo);if(d>max)max=d;}
  return max;
}

(function(){
  var g=document.getElementById('catsGrid');
  CATS.forEach(function(c){
    var cnt=0;for(var i=0;i<DB.length;i++){if(DB[i].c===c.id)cnt++;}
    if(!cnt)return;
    var el=document.createElement('div');el.className='cat';el.dataset.c=c.id;
    el.innerHTML='<div class="cat-row"><span class="cat-ico">'+c.ico+'</span><div><div class="cat-n">'+c.n+'</div><div class="cat-d">'+c.d+'</div></div></div><span class="cat-cnt">'+cnt+'</span>';
    el.addEventListener('click',function(){
      var k=el.dataset.c;
      if(sc[k]){if(Object.keys(sc).length===1)return;delete sc[k];el.classList.remove('on');}
      else{sc[k]=1;el.classList.add('on');}
    });
    g.appendChild(el);
  });
  ['еда','кофе'].forEach(function(id){var el=g.querySelector('[data-c="'+id+'"]');if(el){sc[id]=1;el.classList.add('on');}});
})();

var mIn=document.getElementById('mIn'),mDrop=document.getElementById('mDrop'),mTags=document.getElementById('mTags');
function rDrop(q){
  var ms=MA.filter(function(s){return metro.indexOf(s)===-1&&(!q||s.toLowerCase().indexOf(q)!==-1);}).slice(0,9);
  if(!ms.length){mDrop.classList.remove('show');return;}
  mDrop.innerHTML=ms.map(function(s){
    var safe=s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    var ql=q.toLowerCase(),sl2=s.toLowerCase(),hi=sl2.indexOf(ql);
    var hi2=(q&&hi!==-1)?safe.slice(0,hi)+'<b>'+safe.slice(hi,hi+ql.length)+'</b>'+safe.slice(hi+ql.length):safe;
        return '<div class="mopt" data-s="'+s.replace(/"/g,'&quot;')+'">'+ hi2 +'</div>';
  }).join('');
  mDrop.classList.add('show');
}
mDrop.addEventListener('mousedown',function(e){
  var o=e.target.closest('.mopt');if(!o)return;e.preventDefault();
  var s=o.getAttribute('data-s');if(metro.indexOf(s)===-1)metro.push(s);
  mIn.value='';mDrop.classList.remove('show');rTags();
});
mIn.addEventListener('input', function(){rDrop(this.value.trim().toLowerCase());});
mIn.addEventListener('focus', function(){rDrop(this.value.trim().toLowerCase());});
mIn.addEventListener('blur',  function(){setTimeout(function(){mDrop.classList.remove('show');},200);});
function rTags(){
  mTags.innerHTML=metro.map(function(s){
    return '<div class="mtag">м. '+s+'<button class="mtag-x" data-s="'+s.replace(/"/g,'&quot;')+'">&#215;</button></div>';
  }).join('');
  mTags.querySelectorAll('.mtag-x').forEach(function(x){
    x.addEventListener('click',function(){metro=metro.filter(function(m){return m!==x.getAttribute('data-s');});rTags();});
  });
}

function setDur(d){
  dur=d;
  document.querySelectorAll('.dur-step').forEach(function(el){el.classList.toggle('on',+el.dataset.d===d);});
  document.getElementById('durLabel').textContent=DUR[d].label;
  document.getElementById('durHint').textContent=DUR[d].hint+' · '+pts+' мест';
  document.getElementById('durFill').style.width=DUR[d].fill+'%';
}


document.getElementById('ptsR').addEventListener('input',function(){
  pts=+this.value;document.getElementById('ptsV').textContent=this.value;
});
// ── геометрия маршрута ────────────────────────────────────────────
function pathLen(a){
  var s=0; for(var i=1;i<a.length;i++) s+=hav(a[i-1].la,a[i-1].lo,a[i].la,a[i].lo);
  return s;
}
function diameter(a){
  var m=0;
  for(var i=0;i<a.length;i++)for(var j=i+1;j<a.length;j++){
    var d=hav(a[i].la,a[i].lo,a[j].la,a[j].lo); if(d>m)m=d;
  }
  return m;
}

// ── порядок обхода: ближайший сосед + 2-opt ──────────────────────
function nnFrom(startIdx,a){
  var left=a.slice(), route=[left.splice(startIdx,1)[0]];
  while(left.length){
    var cur=route[route.length-1], bi=0, bd=Infinity;
    for(var i=0;i<left.length;i++){
      var d=hav(cur.la,cur.lo,left[i].la,left[i].lo);
      if(d<bd){bd=d;bi=i;}
    }
    route.push(left.splice(bi,1)[0]);
  }
  return route;
}
function twoOpt(r){
  if(r.length<4) return r;
  var improved=true, guard=0;
  while(improved && guard++<40){
    improved=false;
    for(var i=1;i<r.length-1;i++)for(var k=i+1;k<r.length;k++){
      var cand=r.slice(0,i).concat(r.slice(i,k+1).reverse(),r.slice(k+1));
      if(pathLen(cand)<pathLen(r)-1){r=cand;improved=true;}
    }
  }
  return r;
}
function orderRoute(a,anchorLa,anchorLo){
  if(a.length<3) return a;
  // если задано метро — стартуем от ближайшей к станции точки
  if(anchorLa!==null&&anchorLa!==undefined){
    var si=0,sd=Infinity;
    for(var i=0;i<a.length;i++){
      var d=hav(anchorLa,anchorLo,a[i].la,a[i].lo);
      if(d<sd){sd=d;si=i;}
    }
    return twoOpt(nnFrom(si,a));
  }
  var best=null,bl=Infinity;
  for(var s=0;s<a.length;s++){
    var r=twoOpt(nnFrom(s,a)), l=pathLen(r);
    if(l<bl){bl=l;best=r;}
  }
  return best;
}

// ── наращивание кластера: контроль ПОПАРНОГО разброса ────────────
function growCluster(seed,pool,cats,ptsN,maxD){
  var picked=[seed], used={}; used[seed.n]=1;
  // кандидаты: всё в пределах maxD от seed (надмножество любого валидного кластера)
  var near=pool.filter(function(p){
    return !used[p.n] && hav(seed.la,seed.lo,p.la,p.lo)<=maxD;
  });

  function bestAddition(cand){
    var best=null,bd=Infinity;
    for(var i=0;i<cand.length;i++){
      if(used[cand[i].n]) continue;
      var d=diameter(picked.concat([cand[i]]));
      if(d<bd){bd=d;best=cand[i];}
    }
    return (best&&bd<=maxD)?best:null;
  }

  // фаза 1: закрыть каждую выбранную категорию
  var missing=cats.filter(function(c){return c!==seed.c;});
  for(var m=0;m<missing.length;m++){
    if(picked.length>=ptsN) break;
    var add=bestAddition(near.filter(function(p){return p.c===missing[m];}));
    if(!add) return null;              // в бюджет не влезает — кластер невалиден
    picked.push(add); used[add.n]=1;
  }

  // фаза 2: добить до нужного числа, минимально раздувая разброс
  while(picked.length<ptsN){
    var a2=bestAddition(near);
    if(!a2) break;
    picked.push(a2); used[a2.n]=1;
  }
  return picked;
}

// ── подбор кластера: перебор сидов, выбор самого компактного ─────
function pickCluster(pool,cfg){
  window._usedFallback=false;
  window._fallbackReason='';

  var cats=Object.keys(sc);
  var ptsN=Math.min(pts,pool.length);
  if(!pool.length) return [];

  // якорь
  var anchorLa=null,anchorLo=null;
  if(metro.length){
    var mc=window._MC||{};
    for(var mi=0;mi<metro.length;mi++){
      if(mc[metro[mi]]){anchorLa=mc[metro[mi]][0];anchorLo=mc[metro[mi]][1];break;}
    }
  }

  // сиды: у метро — ближайшие к станции, иначе случайные по всей базе
  var seeds;
  if(anchorLa!==null){
    // ближайшие 30 к станции, из них случайные 16 — чтобы «другой» давал другое
    seeds=pool.slice().sort(function(a,b){
      return hav(anchorLa,anchorLo,a.la,a.lo)-hav(anchorLa,anchorLo,b.la,b.lo);
    }).slice(0,30).sort(function(){return Math.random()-.5;}).slice(0,16);
  }else{
    seeds=pool.slice().sort(function(){return Math.random()-.5;}).slice(0,22);
  }

  // лестница бюджетов: жёсткий → мягче → совсем мягкий
  var ladder=[cfg.maxD, cfg.maxD*1.7, cfg.maxD*2.8, 999999];

  for(var li=0;li<ladder.length;li++){
    var maxD=ladder[li], best=null, bestScore=Infinity;

    for(var si=0;si<seeds.length;si++){
      var cl=growCluster(seeds[si],pool,cats,ptsN,maxD);
      if(!cl||cl.length<Math.min(2,ptsN)) continue;
      var ordered=orderRoute(cl,anchorLa,anchorLo);
      // цель — попасть в масштаб прогулки, а не сжать всё в один двор
      var L=pathLen(ordered);
      var score=Math.abs(L-cfg.target)+(ptsN-cl.length)*3000;
      if(L<cfg.target*0.35) score+=(cfg.target*0.35-L)*1.2;   // слишком кучно — скучно
      if(anchorLa!==null) score+=hav(anchorLa,anchorLo,ordered[0].la,ordered[0].lo)*1.5;
      if(score<bestScore){bestScore=score;best=ordered;}
    }

    // неполный набор принимаем только когда лестница исчерпана
    if(best && best.length<ptsN && li<ladder.length-1) continue;

    if(best){
      if(li===1){window._usedFallback=true;window._fallbackReason='expanded';}
      if(li>=2){window._usedFallback=true;window._fallbackReason='citywide';}
      if(best.length<ptsN){window._usedFallback=true;window._fallbackReason='fewplaces';}
      // БАГ 2: кластер компактный, но далеко от выбранной станции
      if(anchorLa!==null){
        var dAnchor=hav(anchorLa,anchorLo,best[0].la,best[0].lo);
        if(dAnchor>2500){window._usedFallback=true;window._fallbackReason='far';}
      }
      return best;
    }
  }

  // страховка: просто ближайшие к якорю
  window._usedFallback=true; window._fallbackReason=metro.length?'far':'citywide';
  var fb=pool.slice();
  if(anchorLa!==null) fb.sort(function(a,b){
    return hav(anchorLa,anchorLo,a.la,a.lo)-hav(anchorLa,anchorLo,b.la,b.lo);
  });
  else fb.sort(function(){return Math.random()-.5;});
  return orderRoute(fb.slice(0,ptsN),anchorLa,anchorLo);
}


// ── swap single place ─────────────────────────────────────────────

function updateRouteAfterSwap(){
  if(!last || !last._picked) return;
  var picked = last._picked;

  // update yandex map link
  if(picked.length >= 2){
    document.getElementById('yMapBtn').href =
      'https://yandex.ru/maps/?rtext=' +
      picked.map(function(p){return p.la+','+p.lo;}).join('~') +
      '&rtt=pd';
    document.getElementById('yMapBtn').style.display = 'flex';
  }

  // update spread badge
  var spread = Math.round(pathLen(picked));
  var spreadKm = Math.round(spread/100)/10;
  var rbs = document.getElementById('rBs');
  if(rbs){
    // find and update the km badge
    var badges = rbs.querySelectorAll('.rb');
    var updated = false;
    badges.forEach(function(b){
      if(b.textContent.indexOf('км') !== -1){
        b.textContent = '~' + spreadKm + ' км';
        updated = true;
      }
    });
    // if no km badge yet — add one
    if(!updated && spreadKm > 0){
      var span = document.createElement('span');
      span.className = 'rb';
      span.style.background = 'var(--bg2)';
      span.style.color = 'var(--muted)';
      span.textContent = '~' + spreadKm + ' км';
      rbs.appendChild(span);
    }
  }

  // update last._m spread
  if(last._m) last._m.spread = spread;
}

function swapPlace(idx, btn){
  if(!last||!last._picked) return;
  btn.classList.add('spinning');
  btn.textContent='···';

  var cats = Object.keys(sc);
  var cfg = DUR[dur];
  var currentPick = last._picked[idx];
  var currentCat = currentPick ? currentPick.c : null;

  // pool: same category as current place, excluding already picked names
  var usedNames = {};
  last._picked.forEach(function(p){ usedNames[p.n] = 1; });

  // try to find same category first, else any selected category
  var pool = DB.filter(function(p){
    return p.c === currentCat && !usedNames[p.n];
  });
  if(!pool.length){
    pool = DB.filter(function(p){ return cats.indexOf(p.c)!==-1 && !usedNames[p.n]; });
  }

  // prefer nearby places using anchor from last route
  var anchorLa = currentPick ? currentPick.la : null;
  var anchorLo = currentPick ? currentPick.lo : null;
  var others = last._picked.filter(function(p,i){ return i!==idx; });
  var budget = DUR[dur].maxD;
  var fits = pool.filter(function(p){ return diameter(others.concat([p])) <= budget; });
  if(fits.length) pool = fits;
  else if(anchorLa) pool.sort(function(a,b){
    return diameter(others.concat([a])) - diameter(others.concat([b]));
  });
  pool = pool.slice(0, Math.min(12, pool.length)).sort(function(){ return Math.random()-.5; });

  if(!pool.length){
    btn.classList.remove('spinning'); btn.textContent='\u21ba заменить'; return;
  }

  var newPlace = pool[0];
  var newPicked = last._picked.slice();
  newPicked[idx] = newPlace;
  newPicked = orderRoute(newPicked, null, null);
  idx = newPicked.indexOf(newPlace);

  // ask Claude to rewrite just this stop's description in context
  var sys = 'ты — бот канала «мои маршруты». пишешь строчными, живо, с иронией.'
    +' тебе дают обновлённый список мест маршрута — одно место заменили.'
    +' перепиши ТОЛЬКО описание для замененного места (индекс '+idx+').'
    +' пиши описания и историю целиком, не обрывай на полуслове.'
    +' отвечай ТОЛЬКО валидным json без markdown:'
    +' {"name":"точное название","detail":"что там — строчными","metro":"станция","walk":"N мин или null"}';

  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514', max_tokens:600, system:sys,
      messages:[{role:'user', content:'новое место: '+JSON.stringify({name:newPlace.n, detail:newPlace.d, cat:newPlace.c, metro:(newPlace.metro||[]).join(', ')})+'. маршрут: '+JSON.stringify(newPicked.map(function(p){return p.n;}))}]
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    var raw=(d.content||[]).map(function(b){return b.text||'';}).join('').split('```json').join('').split('```').join('').trim();
    var mx=raw.match(/\{[\s\S]*\}/); 
    var stop = mx ? JSON.parse(mx[0]) : {name:newPlace.n, detail:newPlace.d, metro:(newPlace.metro||[])[0]||'', walk:null};
    last._picked = newPicked;
    if(last.stops && last.stops[idx]) last.stops[idx] = stop;
    renderStop(idx, stop, btn.parentNode);
    updateRouteAfterSwap();
  })
  .catch(function(){
    // fallback: just swap without rewriting
    var stop = {name:newPlace.n, detail:newPlace.d, metro:(newPlace.metro||[])[0]||'', walk:null};
    last._picked = newPicked;
    if(last.stops && last.stops[idx]) last.stops[idx] = stop;
    renderStop(idx, stop, btn.parentNode);
    updateRouteAfterSwap();
  })
  .finally(function(){
    btn.classList.remove('spinning'); btn.textContent='\u21ba заменить';
  });
}

function renderStop(idx, s, wrapEl){
  var el = wrapEl.querySelector('.stop');
  if(!el) return;
  el.innerHTML='<div class="snum">'+(idx+1)+'</div><div class="sinfo">'
    +'<div class="sname">'+(s.name||'')+'</div>'
    +'<div class="sdet">'+(s.detail||'')+'</div>'
    +'<div class="smeta">'
    +(s.metro&&s.metro!=='null'&&s.metro!==''?'<span class="sm-m">м. '+s.metro+'</span>':'')
    +(s.walk&&s.walk!=='null'?'<span class="sm-w">'+s.walk+'</span>':'')
    +'</div></div>';
}


function gen(){
  var btn=document.getElementById('genBtn'),sp=document.getElementById('spin'),gt=document.getElementById('genTxt'),rc=document.getElementById('result');
  btn.disabled=true;sp.style.display='block';gt.style.display='none';rc.style.display='none';
  try{if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light');}catch(e){}
  var cats=Object.keys(sc),cfg=DUR[dur];
  var pool=DB.filter(function(p){return cats.indexOf(p.c)!==-1;});
  var picked=pickCluster(pool,cfg);
  if(picked.length<2){
    var used2={};picked.forEach(function(p){used2[p.n]=1;});
    DB.filter(function(p){return cats.indexOf(p.c)!==-1;}).sort(function(){return Math.random()-.5;})
      .forEach(function(p){if(picked.length<pts&&!used2[p.n]){picked.push(p);used2[p.n]=1;}});
  }
  var spread=Math.round(pathLen(picked));
  var sys='ты — бот канала «мои маршруты». пишешь строчными, живо, с иронией, как автор лайфстайл-канала для зумеров.'
    +' формат: '+cfg.label+'. разброс точек: ~'+Math.round(spread/100)/10+' км.'
    +' составь маршрут из предложенных мест в логичном порядке обхода.'
    +' пиши описания и историю целиком, не обрывай на полуслове.'
    +' отвечай ТОЛЬКО валидным json без markdown:'
    +' {"title":"название строчными","badge":"1 слово","story":"2-4 предложения строчными, живо и с характером — не обрывай мысль",'
    +'"stops":[{"name":"точное название","detail":"что там","metro":"станция","walk":"N мин пешком от предыдущей или null"}]}';
  fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1600,system:sys,
      messages:[{role:'user',content:JSON.stringify(picked.map(function(p){return {name:p.n,detail:p.d,cat:p.c,metro:(p.metro||[]).join(', ')};}))  }]})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var raw=(d.content||[]).map(function(b){return b.text||'';}).join('').split('```json').join('').split('```').join('').trim();
    var mx=raw.match(/\{[\s\S]*\}/);if(!mx)throw new Error('nojson');
    last=JSON.parse(mx[0]);last._picked=picked;last._m={cats:cats,dur:dur,metro:metro.slice(),spread:spread};
    render(last);
    try{if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');}catch(e){}
  })
  .catch(function(){
    last={title:'маршрут',badge:'случайный',story:'что-то пошло не так, попробуй ещё раз.',
      stops:picked.map(function(p){return {name:p.n,detail:p.d,metro:(p.metro||[])[0]||'',walk:null};}),
      _picked:picked,_m:{cats:cats,dur:dur,metro:metro.slice(),spread:spread}};
    render(last);
  })
  .finally(function(){btn.disabled=false;sp.style.display='none';gt.style.display='inline';});
}

document.getElementById('genBtn').addEventListener('click',gen);
document.getElementById('regenBtn').addEventListener('click',gen);

function render(r){
  // disclaimer
  var disc=document.getElementById('disclaimer');
  var discTxt=document.getElementById('disclaimerTxt');
  if(window._usedFallback){
    var stName=metro.length?metro[0]:'';
    var rsn=window._fallbackReason;
    if(rsn==='far'){
      discTxt.textContent='рядом с «м. '+stName+'» в карте пока нет таких мест — собрали ближайший маршрут';
    } else if(rsn==='fewplaces'){
      discTxt.textContent='в этих категориях слишком мало мест рядом — точек в маршруте меньше, чем просили';
    } else if(rsn==='citywide'){
      discTxt.textContent=stName
        ? 'рядом с «м. '+stName+'» совсем мало мест в этих категориях'
        : 'подходящих мест рядом друг с другом мало — точки разбросаны по городу';
    } else {
      discTxt.textContent=stName
        ? 'мест прямо у «м. '+stName+'» не хватило — расширили радиус поиска'
        : 'мест рядом друг с другом не хватило — расширили радиус поиска';
    }
    disc.style.display='block';
  } else {
    disc.style.display='none';
  }
  var m=r._m||{}, spreadKm=m.spread?Math.round(m.spread/100)/10:0;
  document.getElementById('rBs').innerHTML=
    '<span class="rb rb-cat">'+(m.cats||[]).join(' + ')+'</span>'+
    '<span class="rb rb-dur">'+DUR[m.dur||0].label+'</span>'+
    (m.metro&&m.metro.length?'<span class="rb rb-m">м. '+m.metro.join(', ')+'</span>':'')+
    (spreadKm?'<span class="rb" style="background:var(--bg2);color:var(--muted)">~'+spreadKm+' км</span>':'');
  document.getElementById('rTitle').textContent=r.title||'';
  var sl=document.getElementById('rStops');sl.innerHTML='';
  (r.stops||[]).forEach(function(s,i){
    var wrap=document.createElement('div');wrap.className='stop-wrap';
    var el=document.createElement('div');el.className='stop';
    el.innerHTML='<div class="snum">'+(i+1)+'</div><div class="sinfo">'
      +'<div class="sname">'+(s.name||'')+'</div>'
      +'<div class="sdet">'+(s.detail||'')+'</div>'
      +'<div class="smeta">'
      +(s.metro&&s.metro!=='null'&&s.metro!==''?'<span class="sm-m">м. '+s.metro+'</span>':'')
      +(s.walk&&s.walk!=='null'?'<span class="sm-w">'+s.walk+'</span>':'')
      +'</div></div>';
    var swapBtn=document.createElement('button');
    swapBtn.className='swap-btn';
    swapBtn.textContent='\u21ba заменить';
    swapBtn.setAttribute('data-idx', i);
    swapBtn.addEventListener('click', function(){ swapPlace(+this.getAttribute('data-idx'), this); });
    wrap.appendChild(el);
    wrap.appendChild(swapBtn);
    sl.appendChild(wrap);
  });
  document.getElementById('rStory').textContent=r.story||'';
  var picked2=r._picked||[];
  if(picked2.length>=2){
    document.getElementById('yMapBtn').href='https://yandex.ru/maps/?rtext='+picked2.map(function(p){return p.la+','+p.lo;}).join('~')+'&rtt=pd';
    document.getElementById('yMapBtn').style.display='flex';
  }
  var rc=document.getElementById('result');rc.style.display='block';
  setTimeout(function(){rc.scrollIntoView({behavior:'smooth',block:'nearest'});},100);
}

document.getElementById('shareBtn').addEventListener('click',function(){
  if(!last)return;
  var m=last._m||{};
  var txt='\u2726 '+last.title+'\n'+DUR[m.dur||0].label+'\n\n'
    +(last.stops||[]).map(function(s,i){return (i+1)+'. '+s.name+'\n   '+s.detail;}).join('\n')
    +'\n\n'+last.story+'\n\n\uD83D\uDCCD t.me/qaroutes';
  try{if(tg&&tg.switchInlineQuery){tg.switchInlineQuery(txt);return;}}catch(e){}
  if(navigator.share){navigator.share({text:txt});}
  else{navigator.clipboard.writeText(txt).then(function(){alert('\u0441\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u043e!');});}
});
